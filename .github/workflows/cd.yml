name: Hospital App CD Deploy

on:
  workflow_run:
    workflows: ["Hospital App CI Check"] # CI-ın adı ilə eyni olmalıdır
    types:
      - completed

jobs:
  cd-deploy-and-test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }} # Yalnız CI uğurlu bitibsə işə düş
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './dist'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}
          netlify-auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      # Bizim məşhur Smoke Test (Tüstü Testi)
      - name: Post-deployment smoke test
        run: |
          echo "⏳ Canlı sayt yoxlanılır: https://ambulance-hospital.netlify.app ..."
          for i in {1..10}; do
            if curl -f https://ambulance-hospital.netlify.app; then
              echo "✅ Möhtəşəm! Sayt canlıda problemsiz işləyir."
              exit 0
            else
              echo "⏳ Gözlənilir... ($i/10)"
              sleep 5
            fi
          done
          exit 1