name: Hospital App CI Check

on:
  push:
    branches: [ main, master ] # Səndə əsas branch hansıdırsa (main və ya master), onu saxla
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Əgər layihəndə eslint və ya xüsusi test scripti yoxdursa, aşağıdakı sətri hələlik şərhdə (comment) saxlaya bilərsən
      # - name: Run Lint / Type Check
      #   run: npm run lint

      - name: Build project
        run: npm run build